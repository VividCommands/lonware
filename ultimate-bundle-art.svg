<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Ultimate Bundle product icons</title>
  <desc id="desc">A monitor, Wi-Fi signal, aim reticle, and keyboard represent the four included tools.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="20" x2="720" y2="430" gradientUnits="userSpaceOnUse">
