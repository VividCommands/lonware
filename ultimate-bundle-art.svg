    <circle cx="660" cy="302" r="2" opacity=".45"/>
  </g>
  <path d="M327 127 410 79l111 63-83 49-111-64Z" fill="#15384D" stroke="url(#edge)" stroke-width="1.5"/>
  <path d="m327 127 111 64v157l-111-64V127Z" fill="url(#face)" stroke="#55CEF7" stroke-opacity=".45" stroke-width="1.5"/>
  <path d="m438 191 83-49v157l-83 49V191Z" fill="#06111D" stroke="#55CEF7" stroke-opacity=".35" stroke-width="1.5"/>
