<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Lonware Ultimate Bundle</title>
  <desc id="desc">A dark premium illustration with a luminous Lonware monolith and orbiting rings.</desc>
  <defs>
    <linearGradient id="bg" x1="70" y1="20" x2="700" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A2034"/>
      <stop offset=".5" stop-color="#050D18"/>
      <stop offset="1" stop-color="#02060D"/>
    </linearGradient>
    <linearGradient id="face" x1="350" y1="95" x2="485" y2="345" gradientUnits="userSpaceOnUse">
      <stop stop-color="#183D55"/>
      <stop offset=".48" stop-color="#0B1C2B"/>
      <stop offset="1" stop-color="#050A12"/>
    </linearGradient>
    <linearGradient id="edge" x1="319" y1="96" x2="488" y2="336" gradientUnits="userSpaceOnUse">
